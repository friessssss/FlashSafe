[package]
name = "flashsafe-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FlashSafe desktop application shell"

[lib]
name = "flashsafe_app"
path = "src/lib.rs"

[[bin]]
name = "flashsafe"
path = "src/main.rs"

[[bin]]
name = "flashsafe-capture-bench"
path = "src/bin/capture_bench.rs"

[[bin]]
name = "flashsafe-pipeline-bench"
path = "src/bin/pipeline_bench.rs"

[dependencies]
flashsafe-core = { path = "../flashsafe-core" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
tray-item = "0.10.0"
eframe = "0.27"
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
windows-sys = "0.52.0"
